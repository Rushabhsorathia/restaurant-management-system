name: Backend (Laravel)

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
  working-directory: backend

jobs:
  test:
    name: Lint & Test (PHP ${{ matrix.php }} / Laravel 11)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rms_test
          MYSQL_USER: rms_test
          MYSQL_PASSWORD: rms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, bcmath, zip
          coverage: none
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare .env
        run: cp .env.example .env
        env:
          DB_DATABASE: rms_test
          DB_USERNAME: rms_test
          DB_PASSWORD: rms_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_CLIENT: predis
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          APP_KEY: base64:c29tZS1zZWNyZXQta2V5LWZvci1jb250aW51b3VzLWludGVncmF0aW9uLW9ubHk=

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Test (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: rms_test
          DB_USERNAME: rms_test
          DB_PASSWORD: rms_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS rms_test;"
          ./vendor/bin/phpunit --testsuite=Feature
